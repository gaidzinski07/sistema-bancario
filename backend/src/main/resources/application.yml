# Configuração comum a todos os ambientes.
# Valores sensíveis vêm de variáveis de ambiente; os defaults servem só para desenvolvimento.
spring:
  application:
    name: banco-backend
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/banco}
    username: ${DB_USER:banco}
    password: ${DB_PASSWORD:banco}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é do Flyway; o Hibernate só confere o mapeamento
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

# Documentação da API (Swagger UI em /swagger-ui.html). Desligada no profile prod.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
