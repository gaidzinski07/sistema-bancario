name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` roda os testes unitários (surefire) e os *IT com Testcontainers (failsafe).
      # O runner do GitHub já tem Docker, então os testes de integração não são pulados aqui.
      - name: Build e testes
        run: ./mvnw -B verify

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build de produção
        run: npx ng build

      - name: Testes unitários (Vitest)
        run: npx ng test --watch=false

  # Navegador de verdade contra o front e a API de verdade (MySQL + seed de dev).
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: banco
          MYSQL_USER: banco
          MYSQL_PASSWORD: banco
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ubanco -pbanco"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sobe a API (profile dev, MySQL na 3307)
        working-directory: backend
        run: |
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/banco-backend-*.jar > ../api.log 2>&1 &
          curl --silent --fail --retry 60 --retry-connrefused --retry-delay 2 http://localhost:8080/actuator/health

      - name: Dependências e navegador do Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes ponta a ponta (Playwright)
        working-directory: frontend
        run: npx playwright test

      - name: Relatórios do e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-e2e
          path: |
            frontend/playwright-report
            frontend/test-results
            api.log
