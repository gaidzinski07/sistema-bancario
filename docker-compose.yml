# Banco de desenvolvimento.
# Porta 3307 no host para não conflitar com um MySQL local já instalado na 3306.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: banco
      MYSQL_USER: banco
      MYSQL_PASSWORD: banco
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubanco", "-pbanco"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
