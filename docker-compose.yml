# Ambiente local.
#
#   docker compose up -d mysql                  # só o banco (desenvolvimento com mvnw + ng serve)
#   docker compose --profile completo up -d     # banco + aplicação (API servindo o Angular) em http://localhost:8080
#
# O MySQL fica na porta 3307 do host para não conflitar com um MySQL local já instalado na 3306.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: banco
      MYSQL_USER: banco
      MYSQL_PASSWORD: banco
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubanco", "-pbanco"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Imagem de produção (Dockerfile) rodando com o profile dev: mesmo artefato que iria para o
  # servidor, mas com os dados de exemplo do seed para demonstração.
  app:
    profiles: ["completo"]
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/banco
      DB_USER: banco
      DB_PASSWORD: banco
    ports:
      - "8080:8080"

volumes:
  mysql-data:
